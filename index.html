<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMDB - Découverte Films</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Header / Navigation -->
    <header class="header">
      <div class="header__container">
        <a href="#/" class="header__logo">🎬 TMDB Explorer</a>
        <nav class="header__nav">
          <a href="#/" class="nav__link" data-route="home">Accueil</a>
          <a href="#/popular" class="nav__link" data-route="popular"
            >Populaires</a
          >
          <a href="#/discover" class="nav__link" data-route="discover"
            >Découverte</a
          >
          <a href="#/search" class="nav__link" data-route="search">Recherche</a>
          <a href="#/favorites" class="nav__link" data-route="favorites"
            >Mes recommandations</a
          >
          <a href="#/compare" class="nav__link" data-route="compare">Comparer</a>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main id="app" class="main">
      <!-- Le contenu dynamique sera injecté ici -->
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>
        Données fournies par
        <a href="https://www.themoviedb.org/" target="_blank">TMDB</a>
      </p>
    </footer>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
    <!-- Le comparateur est géré dans la vue dédiée, pas de panneau global -->
  </body>
</html>
